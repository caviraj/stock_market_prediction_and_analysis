<div class="watchlist-sidebar">
  <div class="sidebar-header">
    <h2>My Watchlist</h2>
  </div>
  
  <div class="watchlist-items" *ngIf="watchlist.length > 0; else emptyState">
    <div class="watchlist-row" *ngFor="let stock of watchlist">
      <div class="row-left">
        <div class="ticker">{{ stock.ticker }}</div>
      </div>
      <div class="row-right">
        <div class="price-info">
          <div class="price">{{ stock.price }}</div>
          <div class="change" [ngClass]="stock.isPositive ? 'text-success' : 'text-danger'">
            {{ stock.change }}
          </div>
        </div>
        <button class="remove-btn" title="Remove">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <div class="empty-state">
      <svg class="bookmark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      </svg>
      <p class="text-muted text-center mt-2">No stocks added yet. Search above to add.</p>
    </div>
  </ng-template>

  <button class="add-btn mt-4">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
    Add to Watchlist
  </button>
</div>
